[package]
name = "topcoat-runtime"
version.workspace = true
edition.workspace = true
authors.workspace = true
description.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true

[features]
router = [
	"dep:futures-channel",
	"dep:futures-core",
	"dep:futures-sink",
	"dep:futures-util",
	"dep:http",
	"dep:pin-project-lite",
	"dep:tokio",
	"dep:topcoat-router",
	"dep:wasm-bindgen-futures",
]

[dependencies]
topcoat-asset.workspace = true
topcoat-core.workspace = true
topcoat-router = { workspace = true, optional = true }
topcoat-view.workspace = true
topcoat-view-macro.workspace = true

futures-channel = { workspace = true, optional = true, features = ["sink"] }
futures-core = { workspace = true, optional = true }
futures-sink = { workspace = true, optional = true }
futures-util = { workspace = true, optional = true, features = ["sink"] }
http = { workspace = true, optional = true }
pin-project-lite = { workspace = true, optional = true }
ref-cast.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true

[target.'cfg(not(target_family = "wasm"))'.dependencies]
topcoat-router = { workspace = true, optional = true, features = ["websocket"] }
tokio = { workspace = true, optional = true, features = ["rt", "sync"] }

[target.'cfg(target_family = "wasm")'.dependencies]
wasm-bindgen-futures = { version = "0.4", optional = true }

[dev-dependencies]
topcoat = { path = "../topcoat", default-features = false, features = ["asset", "router", "runtime", "view"] }

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
